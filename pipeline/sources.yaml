# Corpus des documents programmatiques analysés.
# Chaque entrée est téléchargée par pipeline/fetch.py (copie locale + empreinte SHA-256)
# puis découpée page par page (PDF) ou section par section (pages web) par pipeline/extract.py.
#
# kind: pdf | html | crawl (crawl = toutes les pages web sous `scope`)
# role: programme (texte programmatique principal) | complement (document officiel du parti
#       qui précise ou chiffre le programme) | contexte (document utile mais non programmatique)

documents:
  # ------------------------------------------------------------------ LFI
  - id: lfi-aec-2025
    party: lfi
    role: programme
    title: "L'Avenir en commun — édition 2025 (version en ligne)"
    publisher: "La France insoumise / campagne Mélenchon 2027"
    kind: commoncrawl
    url: https://melenchon2027.fr/programme2025/livre/
    pattern: melenchon2027.fr/programme2025/*
    crawls: [CC-MAIN-2026-21]
    note: >-
      Version en ligne (dernière mise à jour : avril 2025). Retirée de melenchon2027.fr à
      l'approche de la 5e édition (livre, La Dispute, annoncé pour le 6 novembre 2026) :
      le texte est récupéré dans l'archive Common Crawl de mai 2026.

  # ------------------------------------------------------------------ RN
  # Le RN n'a pas publié de programme présidentiel complet au 10 octobre 2026 : son site
  # présente comme « programme » celui des législatives de juin 2024, complété par les
  # contre-budgets du groupe RN à l'Assemblée et par les livrets thématiques.
  # Le contre-budget 2027 (présenté le 6 octobre 2026) n'est pas publié en document.
