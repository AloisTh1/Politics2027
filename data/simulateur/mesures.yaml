# Mesures des programmes du RN et de LFI qui peuvent changer le revenu disponible d'un ménage.
# Chaque mesure renvoie à une mesure de data/programmes/{rn,lfi}/*.yaml par son identifiant.
# - statut `chiffrable` : tous les paramètres sont dans le texte cité (`source`, `autres_sources`) ;
# - statut `parametres-manquants` : le texte ne suffit pas, `manque` dit ce qui fait défaut ;
# - `source.citation` et `autres_sources[].citation` sont vérifiées mot pour mot contre le corpus par
#   tools/sim_data.py, qui en déduit aussi la page et l'adresse du document ;
# - `hypotheses` : hypothèses réglables dans l'interface (définies dans `hypotheses` ci-dessous) ;
# - `hypotheses_fixes` : hypothèses de modélisation non réglables, affichées avec le résultat ;
# - `concerne` : jetons de pertinence (tous, statuts, famille, couple, locataire, proprietaire,
#   electricite, gaz, fioul, minima_sociaux, etudiant...) ; `condition_non_saisie` : condition que le
#   formulaire ne permet pas de tester ;
# - les doublons entre documents ou millésimes ne s'additionnent pas : ils sont rangés dans
#   `autres_sources` de la mesure principale.
date_reference: 2026-10-10
note: >-
  Une mesure n'est chiffrée que si ses paramètres figurent dans le texte cité et si les entrées
  nécessaires existent. Aucun paramètre n'est inventé : toute hypothèse est visible et, quand
  c'est possible, réglable.
hypotheses_generales:
- Les revenus, la composition du foyer et les dépenses saisis sont supposés constants sur douze mois ; le barème
  de l'impôt sur le revenu 2026 (revenus 2025) sert de proxy pour les revenus 2026.
- Le foyer est supposé de nationalité française, résidant en France métropolitaine ; un couple est marié ou pacsé
  et imposé en commun, sauf indication contraire.
- Les droits aux prestations sont les droits théoriques maximaux (pas de non-recours). Les ressources de l'année
  N-2 prises en compte par la CAF sont approchées par le revenu imposable courant.
- 'Les dépenses d''énergie et de carburant sont saisies toutes taxes comprises et restent identiques en volume :
  seul le prix change.'
- Seuls les effets directs sur le budget du foyer sont chiffrés. Le financement des mesures (impôts nouveaux, économies)
  et les effets sur l'emploi, les prix ou la croissance ne sont pas simulés.
- Une mesure n'est chiffrée que si le texte cité donne ses paramètres ; les autres sont listées avec ce qui manque.
  Les deux programmes sont traités avec les mêmes règles.
hypotheses:
  repercussion_tva:
    libelle: Part de la baisse de TVA répercutée sur les prix
    aide: '100 % : les prix baissent de tout l''écart de TVA. En dessous, une partie reste dans les marges.'
    type: pourcentage
    defaut: 1
    min: 0
    max: 1
    pas: 0.05
    mesures:
    - RNEU-14
  baisse_electricite:
    libelle: Baisse du prix de l'électricité
    aide: 30 % dans le livret entreprises, 30 à 40 % de la facture dans le programme des européennes.
    type: pourcentage
    defaut: 0.3
    min: 0.3
    max: 0.4
    pas: 0.01
    mesures:
    - RNENT-01
  part_facture_electricite:
    libelle: Part de la facture d'électricité concernée par la baisse
    aide: '100 % : toute la facture TTC. Réduire si la baisse ne porte que sur la part énergie, hors taxes et acheminement.'
    type: pourcentage
    defaut: 1
    min: 0
    max: 1
    pas: 0.05
    mesures:
    - RNENT-01
  part_primes_fonctionnaire:
    libelle: Part des primes dans la rémunération brute d'un fonctionnaire
    aide: '0 % : tout le brut est du traitement indiciaire. Les primes (RAFP à 5 %) ne sont pas revalorisées par
      le point d''indice.'
    type: pourcentage
    defaut: 0
    min: 0
    max: 0.6
    pas: 0.05
    mesures:
    - LFI-09.01-04
    modele: true
  age_max_jeunes:
    libelle: Âge limite des jeunes visés par la garantie d'autonomie
    aide: Le texte dit « jeunes » sans âge. 25 ans par défaut, comme pour la conscription citoyenne du même programme.
    type: nombre
    unite: ans
    defaut: 25
    min: 18
    max: 30
    pas: 1
    mesures:
    - LFI-10.03-01
  csg_retraite:
    libelle: Taux de CSG sur les pensions de retraite
    aide: '« Automatique » : déduit du revenu imposable courant, faute du revenu fiscal de référence de l''année
      N-2.'
    type: choix
    choix:
    - - auto
      - Automatique
    - - plein
      - Taux plein (8,3 %)
    - - median
      - Taux médian (6,6 %)
    - - reduit
      - Taux réduit (3,8 %)
    - - exonere
      - Exonéré
    defaut: auto
    modele: true
  activite_micro:
    libelle: Activité de l'indépendant (micro-entrepreneur)
    aide: Détermine le taux de cotisations et l'abattement fiscal.
    type: choix
    choix:
    - - services_bic
      - Prestations de services BIC ou artisan (21,2 %)
    - - vente
      - Vente de marchandises (12,3 %)
    - - liberal_bnc
      - Profession libérale non réglementée (25,6 %)
    - - cipav
      - Profession libérale Cipav (23,2 %)
    defaut: services_bic
    modele: true
  parent_isole:
    libelle: Parent seul élevant seul ses enfants (case T)
    aide: Ouvre une demi-part fiscale supplémentaire pour un parent seul. À décocher en cas de garde alternée.
    type: booleen
    defaut: true
    modele: true
