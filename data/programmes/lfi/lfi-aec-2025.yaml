- page: 39
  kind: sondage
  text: 70 % des Français se déclarent favorables à l’instauration de la semaine de 4 jours, 32h payées 35h (Ifop, 2024)
- page: 41
  kind: sondage
  text: 76 % des Français sont pour l’augmentation du SMIC à 1400 euros net par mois (Harris Interactive, juillet 2021)
- page: 44
  kind: sondage
  text: 63 % des Français sont pour l’abrogation des lois travail initiées par François Hollande et Emmanuel Macron (Harris Interactive, juillet 2021)
- page: 44
  kind: sondage
  text: 81 % des Français s’expriment en faveur de la reconnaissance du burn-out comme une maladie professionnelle (Harris Interactive, janvier 2018)
- page: 45
  kind: sondage
  text: De janvier à juin 2023, notre pays a connu une des mobilisations les plus massives de son histoire contre la réforme des retraites d’Emmanuel Macron et d’Elisabeth Borne. Le Gouvernement a choisi de contourner le Parlement. Imposée par l’article 49.3 contre le refus de 70 % des Français et plus de 90 % des actifs, cette réforme n’a jamais été votée à l’Assemblée nationale. Malgré les mensonges du Gouvernement sur les économies réalisées ou la fausse promesse d’une retraite minimale à 1 200 €, nos concitoyens ont compris qu’ils allaient devoir travailler toujours plus et subir une baisse des pensions. Pour vivre plus longtemps, dans des conditions dignes et en bonne santé, il faut pouvoir s’arrêter de travailler suffisamment tôt.
- page: 45
  kind: sondage
  text: 83 % des Français sont pour que chaque retraité touche au minimum une pension égale au SMIC (Harris Interactive, juillet 2021)
