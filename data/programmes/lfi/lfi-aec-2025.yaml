- id: LFI-02.01-02
  page: 12
  kind: mesure
  themes:
  - services-publics
  - entreprises-industrie
  text: Créer un défenseur des biens communs chargé de produire et publier un rapport annuel
- id: LFI-02.01-03
  page: 12
  kind: mesure
  themes:
  - services-publics
  - entreprises-industrie
  - energie
  - sante
  text: Empêcher le droit de propriété privée de prévaloir sur la protection de l’eau, de l’air, de l’alimentation, du vivant, de la forêt, de la santé et de l’énergie
- id: LFI-02.01-04
  page: 12
  kind: mesure
  themes:
  - services-publics
  - entreprises-industrie
  text: Garantir un accès respectueux à la nature pour toutes et tous en rétablissant l’accès aux sentiers balisés, y compris s’ils sont sur une propriété privée, grâce à la mise en place de servitudes de passage encadrées
- id: LFI-02.02-01
  page: 13
  kind: mesure-cle
  themes:
  - entreprises-industrie
  - services-publics
  text: Revenir sur les privatisations (aéroports, autoroutes, Française des Jeux, etc.)
- id: LFI-02.02-02
  page: 13
  kind: mesure
  themes:
  - entreprises-industrie
  - services-publics
  text: Rendre effectif le droit de réquisition des usines et entreprises d’intérêt général par l’État
- id: LFI-02.02-03
  page: 13
  kind: mesure
  themes:
  - entreprises-industrie
  - services-publics
  text: Décréter un moratoire sur les partenariats publics-privés (PPP), auditer ceux en cours et abroger les dispositions législatives les permettant
- id: LFI-02.02-04
  page: 13
  kind: mesure
  themes:
  - entreprises-industrie
  - services-publics
  - securite-justice
  text: Poursuivre les atteintes au patrimoine industriel français faisant partie des « intérêts fondamentaux de la Nation », comme le prévoit le Code pénal
- id: LFI-02.02-05
  page: 13
  kind: mesure
  themes:
  - entreprises-industrie
  - services-publics
  - energie
  text: 'Constituer des pôles publics dans les secteurs stratégiques : médicaments, transports et mobilité, banque, énergie, armement'
- id: LFI-03.01-01
  page: 15
  kind: mesure-cle
  themes:
  - travail
