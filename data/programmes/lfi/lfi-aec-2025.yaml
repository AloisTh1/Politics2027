- id: LFI-04.01-03
  page: 18
  kind: mesure
  themes:
  - libertes-laicite
  text: Créer une nouvelle forme d’adoption sociale, ouvrant un « partenariat social »
- id: LFI-04.01-04
  page: 18
  kind: mesure
  themes:
  - libertes-laicite
  - feminisme
  text: Soutenir l’inclusion du droit à l’IVG et à la contraception, et leur accès gratuit pour toutes les femmes, dans la Charte européenne des droits fondamentaux
- id: LFI-04.01-05
  page: 18
  kind: mesure
  themes:
