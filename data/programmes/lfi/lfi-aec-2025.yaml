- id: LFI-03.02-04
  page: 16
  kind: mesure
  themes:
  - institutions
  text: Refuser les fusions forcées de communes
- id: LFI-03.02-05
  page: 16
  kind: mesure
  themes:
  - institutions
  text: Augmenter l’enveloppe budgétaire des communes rurales par la création d’un fonds de soutien communal notamment pour recruter et revaloriser les agents
- id: LFI-03.02-06
  page: 16
  kind: mesure
  themes:
  - institutions
  text: Revaloriser et rééquilibrer les indemnités des élus en fonction non pas du nombre d’habitants de la commune mais du temps de travail nécessaire pour faire fonctionner la commune
- id: LFI-03.02-07
  page: 16
  kind: mesure
  themes:
  - institutions
  text: Valoriser les emplois de secrétaires de mairies en favorisant le recrutement à temps complet et en développant des formations adaptées
- id: LFI-03.02-08
  page: 16
  kind: mesure
  themes:
  - institutions
  - feminisme
  text: Instaurer le scrutin de liste dans toutes les communes et imposer la parité dans le binôme maire – premier adjoint
- id: LFI-03.02-09
  page: 16
  kind: mesure
  themes:
  - institutions
  - feminisme
