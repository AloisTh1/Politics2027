  kind: sondage
  text: 76 % des Français sont pour rétablir le libre choix de sa filière d’inscription à l’université en supprimant Parcoursup (Harris Interactive, juillet 2021)
- page: 29
  kind: sondage
  text: 74 % des Français sont favorables à un service citoyen mixte, d’une durée de 9 mois, payé au SMIC (Harris Interactive, juillet 2021)
- page: 35
  kind: sondage
  text: 'Le président des riches n’a fait qu’aggraver les injustices de notre système fiscal et créer de nouveaux privilèges fiscaux pour les riches. C’est en France que le nombre de millionnaires progresse le plus en Europe. Les riches y sont de plus en plus riches : alors que les quatre premiers milliardaires français et leurs familles ont vu leur fortune augmenter de 87 % depuis 2020, la richesse cumulée de 90 % des Français a baissé. Il y a cinq ans déjà, le mouvement des Gilets jaunes sonnait l’alerte. Notre fiscalité doit être entièrement refondée sur des bases claires et justes, en appliquant le principe de progressivité : plus on gagne d’argent, plus on contribue au bien public !'
- page: 35
  kind: sondage
  text: 68 % des Français sont pour que l’impôt sur le revenu augmente pour les personnes qui gagnent plus de 4000 euros net par mois et baisse pour les autres (Harris Interactive, juillet 2021)
- page: 35
  kind: sondage
  text: 86 % des Français sont pour faire payer plus d’impôts à Google, Amazon, Facebook et Apple qu’ils n’en payent aujourd’hui (Harris Interactive, juillet 2021)
- page: 35
  kind: sondage
  text: 79 % des Français se déclarent favorables à une taxe exceptionnelle sur les « surprofits », c’est-à-dire les profits exceptionnels par rapport aux années précédentes que les grandes entreprises ont réalisés pendant la crise sanitaire (Harris Interactive, mai 2021)
- page: 35
  kind: sondage
  text: 78 % des Français sont pour le rétablissement de l’ISF (Ifop pour l’Humanité, mai 2021)
- page: 38
  kind: sondage
