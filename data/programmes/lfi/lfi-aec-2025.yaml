  text: Créer un droit de préemption pour permettre aux salariés de reprendre leur entreprise sous la forme d’une coopérative
- id: LFI-03.01-02
  page: 15
  kind: mesure
  themes:
  - travail
  - entreprises-industrie
  text: Accorder aux comités d’entreprise un droit de veto suspensif sur les plans de licenciements et de nouveaux droits de contrôle sur les finances de leur entreprise
- id: LFI-03.01-03
  page: 15
  kind: mesure
  themes:
  - travail
  - entreprises-industrie
  text: Donner plus de pouvoir aux salariés lors des procédures de redressement et de liquidation d’entreprise et instaurer le droit à un vote de défiance à l’égard des dirigeants d’entreprise ou des projets stratégiques
- id: LFI-03.01-04
  page: 15
  kind: mesure
  themes:
  - travail
  - entreprises-industrie
  text: Augmenter la représentation des salariés dans les instances de décision des grandes entreprises à au moins un tiers et inclure d’autres parties prenantes comme les associations environnementales ou de consommateurs
- id: LFI-03.01-05
  page: 15
  kind: mesure
  themes:
  - travail
  - entreprises-industrie
  text: Garantir les droits des représentants des personnels et des délégués syndicaux contre les licenciements abusifs des salariés protégés
- id: LFI-03.02-01
  page: 16
  kind: mesure-cle
  themes:
  - institutions
  text: Redonner aux communes le rôle de cellule de base de la démocratie locale, permettre leur libre association
- id: LFI-03.02-02
  page: 16
  kind: mesure
  themes:
  - institutions
  text: Supprimer les mégarégions et les métropoles technocratiques, et revenir sur l’obligation d’appartenance des communes à des intercommunalités en abrogeant la loi portant sur la Nouvelle Organisation territoriale de la République (NOTRe)
- id: LFI-03.02-03
  page: 16
  kind: mesure
  themes:
  - institutions
