  url: https://melenchon2027.fr/programme2025/livre/chapitre18/s1/
  title: Protéger les mers et océans
  summary: 'Protéger les mers et océans. 13 mesure(s), dont la mesure-clé : « Œuvrer à la création d’un droit international de la biodiversité marine, notamment dans les grands fonds ». Constat d''ouverture : « Les océans sont aujourd’hui en danger. »'
- n: 101
  ref: ch. 18, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre18/s2/
  title: Être à la hauteur de la responsabilité maritime française
  summary: 'Être à la hauteur de la responsabilité maritime française. 6 mesure(s), dont la mesure-clé : « Développer les énergies marines renouvelables (EMR), comme l’hydrolien, dans le cadre du plan de transition énergétique et d’une maîtrise publique des installations et réseaux tout en veillant à concilier les usages en mer ». Constat d''ouverture : « La France est une puissance maritime qui s’ignore. »'
- n: 102
  ref: ch. 18, § 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre18/s3/
  title: Relancer la découverte de l’espace
  summary: 'Relancer la découverte de l’espace. 9 mesure(s), dont la mesure-clé : « Lutter contre la course à l’armement spatial tout en garantissant la souveraineté de la France face aux nouvelles menaces ». Constat d''ouverture : « L’indépendance de la France et notre contribution à la connaissance sont liées à l’espace. »'
- n: 103
  ref: ch. 18, § 4
  url: https://melenchon2027.fr/programme2025/livre/chapitre18/s4/
  title: Affirmer le caractère d’intérêt général de la révolution numérique
  summary: 'Affirmer le caractère d’intérêt général de la révolution numérique. 6 mesure(s), dont la mesure-clé : « Garantir le droit à un accès minimal gratuit à Internet ». Constat d''ouverture : « La révolution numérique est une chance immense pour l’humanité. »'
- n: 104
  ref: ch. 18, § 5
  url: https://melenchon2027.fr/programme2025/livre/chapitre18/s5/
  title: Garantir la souveraineté numérique de la France
  summary: 'Garantir la souveraineté numérique de la France. 17 mesure(s), dont la mesure-clé : « Garantir la neutralité du Net, c’est à dire l’accès égal de chacun et l’égalité de traitement ». Constat d''ouverture : « La mise en réseau mondiale permet de nouvelles coopérations à travers la circulation des idées, des paroles et des écrits. »'
measures:
- id: LFI-01.01-01
  page: 5
  kind: mesure-cle
  themes:
  - institutions
  text: Convoquer une Constituante pour passer à la 6e République
- id: LFI-01.01-02
  page: 5
  kind: mesure
  themes:
  - institutions
  - feminisme
  text: 'Convoquer un référendum (article 11) pour engager le processus constituant et décider des modalités de composition de l’Assemblée constituante : mode de scrutin, parité, tirage au sort et incompatibilités ; et des modalités de délibération : comités constituants et participation citoyenne'
- id: LFI-01.01-03
  page: 5
  kind: mesure
  themes:
  - institutions
  text: Aucun parlementaire des anciennes assemblées ne pourra siéger dans cette Assemblée constituante ; les délégués à l’Assemblée constituante ne pourront être candidats aux élections suivant l’entrée en vigueur de la Constitution
- id: LFI-01.01-04
  page: 5
  kind: mesure
  themes:
  - institutions
  text: Le projet de Constitution proposé par l’Assemblée constituante sera soumis à référendum après deux ans de travaux. En cas de vote négatif, la Constituante reprendrait ses travaux
- id: LFI-01.02-01
  page: 6
  kind: mesure-cle
  themes:
  - institutions
  text: Passer à une 6e République qui soit un régime parlementaire stable
- id: LFI-01.02-02
  page: 6
  kind: mesure
  themes:
  - institutions
  text: Élire l’Assemblée nationale au scrutin proportionnel
- id: LFI-01.02-03
  page: 6
  kind: mesure
  themes:
  - institutions
  text: Obliger le gouvernement à rendre réellement des comptes devant le Parlement
- id: LFI-01.02-04
  page: 6
  kind: mesure
  themes:
  - institutions
  text: Abolir les procédures de « votes forcés » du Parlement comme l’article 49.3 de la Constitution de la 5e République
- id: LFI-01.03-01
  page: 7
  kind: mesure-cle
  themes:
  - institutions
  text: Mettre en place un plan de séparation de l’argent et de l’État
- id: LFI-01.03-02
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Combattre l’influence des lobbys dans le débat parlementaire, notamment en imposant la transparence des agendas des membres des bureaux des Parlements et du gouvernement, interdire l’entrée du Parlement aux lobbyistes et leurs cadeaux aux parlementaires, aux membres du gouvernement et à leurs cabinets
- id: LFI-01.03-03
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Rendre inéligible toute personne condamnée pour corruption et mettre en place un plan national de lutte contre la corruption et les délits de probité
- id: LFI-01.03-04
  page: 7
  kind: mesure
  themes:
  - institutions
  text: 'Durcir les règles contre les conflits d’intérêts et interdire le pantouflage : tout haut fonctionnaire souhaitant travailler dans le privé devra démissionner de la fonction publique et rembourser le prix de sa formation s’il n’a pas servi au moins dix ans'
- id: LFI-01.03-05
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Allonger à dix ans les périodes d’interdiction d’exercice d’une fonction privée après avoir exercé une activité dans la fonction publique relative au même secteur
- id: LFI-01.03-06
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Garantir des recrutements qui reflètent la diversité sociale dans les concours de la fonction publique
- id: LFI-01.03-07
  page: 7
  kind: mesure
  themes:
  - institutions
  - fiscalite
  - securite-justice
  text: 'Supprimer le monopole du déclenchement de poursuites judiciaires par la seule administration fiscale pour toutes les affaires en cas de fraude, quelle qu’elle soit : la justice doit pouvoir enquêter librement, même contre l’avis du ministre'
- id: LFI-01.03-08
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Mettre fin au monopole de la parole des patrons par le Medef et fonder la représentativité des organisations patronales sur la base d’élections des chefs d’entreprise, comme c’est le cas pour les syndicats de salariés
- id: LFI-01.03-09
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Organiser l’élection des administrateurs de la Sécurité sociale par les assurés eux-mêmes et leur donner le pouvoir de lever les cotisations
- id: LFI-01.03-10
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Réformer le financement de la vie politique et abaisser à 200 euros le plafond des dons individuels aux partis politiques
- id: LFI-01.03-11
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Interdire la sous-traitance et la surfacturation de la mise en œuvre et de l’évaluation des politiques publiques à des cabinets de conseils privés
- id: LFI-01.03-12
  page: 7
  kind: mesure
  themes:
  - institutions
  text: Abolir la réforme Macron du corps préfectoral et diplomatique
- id: LFI-01.04-01
  page: 8
  kind: mesure-cle
  themes:
  - institutions
  text: Instaurer le Référendum d’initiative citoyenne (RIC), par lequel les citoyens qui réunissent suffisamment de signatures peuvent révoquer des élus, proposer ou abroger une loi et modifier la Constitution
- id: LFI-01.04-02
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Donner le droit de vote à 16 ans
- id: LFI-01.04-03
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Reconnaître le vote blanc, mettre en place le vote obligatoire et instaurer un seuil de votes exprimés pour valider une élection
- id: LFI-01.04-04
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Instaurer une procédure de parrainages citoyens pour l’élection présidentielle en alternative aux 500 parrainages d’élus
- id: LFI-01.04-05
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Interdire la sous-traitance des opérations de propagande électorale à des entreprises privées
- id: LFI-01.04-06
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Présenter systématiquement au bureau de l’Assemblée nationale les propositions émises par les citoyens dans le cadre de conventions citoyennes ou d’assemblées créées à cet effet
- id: LFI-01.04-07
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Rendre obligatoire le recours au référendum en cas de modification de la Constitution ou d’adoption d’un nouveau traité européen
- id: LFI-01.04-08
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Affirmer les trois échelons d’organisation décentralisée (communes, départements, régions) pour mettre fin à la superposition d’échelons technocratiques (métropoles, intercommunalités géantes…) qui éloigne les citoyens des prises de décision
- id: LFI-01.04-09
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Rendre aux communes leur liberté de coopération
- id: LFI-01.04-10
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Organiser une conférence sur l’avenir institutionnel des territoires insulaires et éloignés
- id: LFI-01.04-11
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Donner à la Corse le statut garanti par l’article 74 de la Constitution
- id: LFI-01.04-12
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Rendre effectif le principe du non-cumul des mandats et des indemnités, y compris dans le temps
- id: LFI-01.04-13
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Instaurer un congé parental pour les élus en donnant la possibilité d’être remplacés pendant cette période
- id: LFI-01.04-14
  page: 8
  kind: mesure
  themes:
  - institutions
  text: 'Organiser la sortie du mandat : garantir un droit à la formation professionnelle pour les élus'
- id: LFI-01.04-15
  page: 8
  kind: mesure
  themes:
  - institutions
  text: Faire voter une loi d’amnistie pour les syndicalistes, les Gilets jaunes, les militants pour la paix, les écologistes, les associatifs et des différents mouvements sociaux dans les Outre-mer, condamnés pour leur participation à la vie publique
- id: LFI-01.05-01
  page: 9
  kind: mesure-cle
  themes:
  - libertes-laicite
  text: Garantir la liberté de conscience et l’application stricte de la laïcité
- id: LFI-01.05-02
  page: 9
  kind: mesure
  themes:
  - libertes-laicite
  text: Abroger le concordat d’Alsace-Moselle et les divers statuts spécifiques en vigueur dans les Outre-mer
- id: LFI-01.05-03
  page: 9
  kind: mesure
  themes:
  - libertes-laicite
  text: Interdire aux élus locaux, parlementaires, ministres et préfets d’assister à des cérémonies religieuses au titre de leurs fonctions ou de recevoir des titres religieux, refuser l’attribution du titre de chanoine de Latran au président de la République
- id: LFI-01.05-04
  page: 9
  kind: mesure
  themes:
  - libertes-laicite
  text: Combattre tous les communautarismes et l’usage politique des religions
- id: LFI-01.05-05
  page: 9
  kind: mesure
  themes:
  - libertes-laicite
  text: Refuser les financements publics pour la construction d’édifices religieux, d’activités cultuelles et d’établissements confessionnels
- id: LFI-01.05-06
  page: 9
  kind: mesure
  themes:
  - libertes-laicite
  text: Garantir l’accès à une école publique laïque dans chaque commune du pays
- id: LFI-01.05-07
  page: 9
  kind: mesure
  themes:
  - libertes-laicite
  text: Rétablir et augmenter les moyens et l’autonomie de la mission interministérielle de vigilance et de lutte contre les dérives sectaires (Miviludes)
- id: LFI-01.06-01
  page: 10
  kind: mesure-cle
  themes:
  - libertes-laicite
  text: Garantir l’indépendance, le pluralisme et le financement de l’audiovisuel public en instaurant une contribution audiovisuelle dédiée, universelle et progressive
- id: LFI-01.06-02
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: 'Adopter une loi anti-concentration dans les médias et engager leur démocratisation :'
- id: LFI-01.06-03
  page: 10
  kind: sous-mesure
  themes:
  - libertes-laicite
  text: Élargir les règles anti-concentration sans tenir compte du support (quotidiens, hebdomadaires, édition)
  parent: LFI-01.06-02
- id: LFI-01.06-04
  page: 10
  kind: sous-mesure
  themes:
  - libertes-laicite
  text: Établir des règles anti-concentrations horizontales (détenir à la fois des entreprises de presse, télévision, radio, etc.) ainsi qu’entre filières des médias et d’autres industries culturelles comme l’édition
  parent: LFI-01.06-02
- id: LFI-01.06-05
  page: 10
  kind: sous-mesure
  themes:
  - libertes-laicite
  text: Empêcher le même groupe de posséder à la fois les infrastructures (les réseaux, les box) et la production des contenus (chaînes, programmes, droits sportifs), ce qui crée de fait des situations de monopole
  parent: LFI-01.06-02
- id: LFI-01.06-06
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Transformer le « Conseil de déontologie des médias » créé en 2019 en véritable contre-pouvoir citoyen
- id: LFI-01.06-07
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Protéger le secteur des intérêts financiers et politiques en dotant les rédactions d’un statut juridique, en introduisant une charte déontologique dans la convention collective
- id: LFI-01.06-08
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Instaurer une neutralité des plateformes pour empêcher les espaces numériques qui servent à transmettre des informations d’être des instruments d’influence au service des convictions personnelles de leurs dirigeants
- id: LFI-01.06-09
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Donner aux abonnés des journaux et aux usagers de l’audiovisuel public des droits sur la gouvernance de ces médias
- id: LFI-01.06-10
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Réserver les aides publiques à la presse aux seuls médias d’information, mutualiser les outils de distribution (imprimeries, serveurs, distribution)
- id: LFI-01.06-11
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Élire au Parlement les présidents de France Télévisions et de Radio France
- id: LFI-01.06-12
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Favoriser les coopératives de journalistes, travailleurs des médias et de lecteurs/spectateurs/auditeurs, attribuer des fréquences aux médias locaux et associatifs
- id: LFI-01.06-13
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Renforcer la liberté des journalistes en luttant contre les « procédures bâillons », empêcher les procédures relatives à la liberté de la presse d’être jugées devant des tribunaux de commerce
- id: LFI-01.06-14
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Protéger les journalistes couvrant les manifestations contre les violences, pour leur permettre d’exercer leur droit d’informer
- id: LFI-01.06-15
  page: 10
  kind: mesure
  themes:
  - libertes-laicite
  text: Appliquer la loi visant à plus de transparence dans les sondages politiques adoptée à l’unanimité au Sénat en 2011 et interdire les sondages dans les jours précédant les élections comme c’était le cas jusqu’en 2002
- id: LFI-02.01-01
  page: 12
  kind: mesure-cle
  themes:
  - services-publics
  - entreprises-industrie
