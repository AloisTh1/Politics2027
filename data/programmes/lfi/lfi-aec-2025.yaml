doc: lfi-aec-2025
pages:
- n: 1
  ref: Sommaire
  url: https://melenchon2027.fr/programme2025/livre/
  title: La France Insoumise - L'avenir en commun
  summary: 'Page d''accueil du livre-programme : table des matières (navigation seule).'
- n: 2
  ref: Introduction
  url: https://melenchon2027.fr/programme2025/livre/introduction/
  title: 'Introduction : Vers une nouvelle France'
  summary: 'Introduction (C. Guetté, H. Clouet, J.-L. Mélenchon) : historique du programme (831 mesures, 143 ajoutées et 120 précisées dans cette édition), la « nouvelle France », les « droits de l''espèce humaine », la règle verte, la 6e République.'
- n: 3
  ref: Ouverture de partie
  url: https://melenchon2027.fr/programme2025/livre/faire-la-revolution-citoyenne/
  title: Faire la révolution citoyenne
  summary: 'Ouverture de la partie 1 : citations (Robespierre, Louise Michel) ; la Ve République « a fait son temps », nouvelle Constitution par le peuple.'
- n: 4
  ref: ch. 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre1/
  title: 'Chapitre 1 : Le pouvoir au peuple'
  summary: Page d'ouverture du chapitre 1 (titre seul).
- n: 5
  ref: ch. 1, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre1/s1/
  title: Réunir une Assemblée constituante pour passer à la 6e République
  summary: 'Réunir une Assemblée constituante pour passer à la 6e République. 4 mesure(s), dont la mesure-clé : « Convoquer une Constituante pour passer à la 6e République ». Constat d''ouverture : « Les institutions de la 5e République sont devenues dangereuses. »'
- n: 6
  ref: ch. 1, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre1/s2/
  title: Abolir la monarchie présidentielle
  summary: 'Abolir la monarchie présidentielle. 4 mesure(s), dont la mesure-clé : « Passer à une 6e République qui soit un régime parlementaire stable ». Constat d''ouverture : « Le président de la République concentre beaucoup trop de pouvoirs : tout le pays est entraîné par sa seule volonté. »'
- n: 7
  ref: ch. 1, § 3
  url: https://melenchon2027.fr/programme2025/s3/
  title: Balayer l’oligarchie, abolir les privilèges de la caste
  summary: 'Balayer l’oligarchie, abolir les privilèges de la caste. 12 mesure(s), dont la mesure-clé : « Mettre en place un plan de séparation de l’argent et de l’État ». Constat d''ouverture : « La collusion entre des intérêts privés, et l’oligarchie qui s’est emparée de nos institutions est devenue criante sous Emmanuel Macron. »'
- n: 8
  ref: ch. 1, § 4
  url: https://melenchon2027.fr/programme2025/livre/faire-la-revolution-citoyenne/chapitre1-3/s4/
  title: Une République permettant l’intervention populaire
  summary: 'Une République permettant l’intervention populaire. 15 mesure(s), dont la mesure-clé : « Instaurer le Référendum d’initiative citoyenne (RIC), par lequel les citoyens qui réunissent suffisamment de signatures peuvent révoquer des élus, proposer ou abroger une loi et modifier la Constitution ». Constat d''ouverture : « Les citoyens ne doivent pas être tenus à l’écart de la vie publique en démocratie. »'
- n: 9
  ref: ch. 1, § 5
  url: https://melenchon2027.fr/programme2025/livre/faire-la-revolution-citoyenne/chapitre1-3/s5/
  title: Une République laïque
  summary: 'Une République laïque. 7 mesure(s), dont la mesure-clé : « Garantir la liberté de conscience et l’application stricte de la laïcité ». Constat d''ouverture : « La laïcité est le principe qui garantit la liberté de conscience, le libre exercice des cultes et l’égalité entre tous les citoyens. »'
- n: 10
  ref: ch. 1, § 6
  url: https://melenchon2027.fr/programme2025/livre/chapitre1/s6/
  title: La Révolution citoyenne dans les médias
  summary: 'La Révolution citoyenne dans les médias. 15 mesure(s), dont la mesure-clé : « Garantir l’indépendance, le pluralisme et le financement de l’audiovisuel public en instaurant une contribution audiovisuelle dédiée, universelle et progressive ». Constat d''ouverture : « L’information doit être libre et pluraliste ; c’est une exigence démocratique que nous garantirons. »'
- n: 11
  ref: ch. 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre2/
  title: 'Chapitre 2 : Par delà la propriété privée'
  summary: Page d'ouverture du chapitre 2 (titre seul).
- n: 12
  ref: ch. 2, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre2/s1/
  title: Collectiviser les biens communs fondamentaux
  summary: 'Collectiviser les biens communs fondamentaux. 4 mesure(s), dont la mesure-clé : « Établir par référendum la liste des biens communs et services essentiels et les collectiviser ». Constat d''ouverture : « Une minorité veut vendre au marché jusqu’aux biens les plus essentiels à la survie humaine. »'
- n: 13
  ref: ch. 2, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre2/s2/
  title: Mettre fin au pillage économique de la Nation
  summary: 'Mettre fin au pillage économique de la Nation. 5 mesure(s), dont la mesure-clé : « Revenir sur les privatisations (aéroports, autoroutes, Française des Jeux, etc.) ». Constat d''ouverture : « Infrastructures, services publics, fleurons industriels ou technologiques, industries de souveraineté : combien de privatisations à vil prix, de partenariats abusifs, d’ouvriers au savoir-faire inestimable jetés dans la précarité ? »'
- n: 14
  ref: ch. 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre3/
  title: 'Chapitre 3 : Citoyens dans l’entreprise et dans la ville'
  summary: Page d'ouverture du chapitre 3 (titre seul).
- n: 15
  ref: ch. 3, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre3/s1/
  title: Reconnaître la citoyenneté dans l’entreprise et des droits nouveaux aux salariés
  summary: 'Reconnaître la citoyenneté dans l’entreprise et des droits nouveaux aux salariés. 5 mesure(s), dont la mesure-clé : « Créer un droit de préemption pour permettre aux salariés de reprendre leur entreprise sous la forme d’une coopérative ». Constat d''ouverture : « La démocratie ne doit pas s’arrêter aux seules institutions. »'
- n: 16
  ref: ch. 3, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre3/s2/
  title: Une République affirmant le rôle central des communes
  summary: 'Une République affirmant le rôle central des communes. 9 mesure(s), dont la mesure-clé : « Redonner aux communes le rôle de cellule de base de la démocratie locale, permettre leur libre association ». Constat d''ouverture : « Les communes sont les structures de base de la transformation : elles incarnent le premier échelon de la démocratie, là où le pouvoir s’exerce au plus près des habitants. »'
- n: 17
  ref: ch. 4
  url: https://melenchon2027.fr/programme2025/livre/chapitre4/
  title: 'Chapitre 4 : Étendre le domaine de la liberté'
  summary: Page d'ouverture du chapitre 4 (titre seul).
- n: 18
  ref: ch. 4, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre4/s1/
  title: Une nouvelle étape des libertés et de l’émancipation individuelle
  summary: 'Une nouvelle étape des libertés et de l’émancipation individuelle. 9 mesure(s), dont la mesure-clé : « Constitutionnaliser la non-marchandisation du corps humain et le droit fondamental de disposer de soi en toutes circonstances ». Constat d''ouverture : « La liberté de choisir sa vie est un droit fondamental de tous les êtres humains. »'
- n: 19
  ref: ch. 4, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre4/s2/
  title: Sortir de l’état d’urgence permanent
  summary: 'Sortir de l’état d’urgence permanent. 8 mesure(s), dont la mesure-clé : « Élaborer une nouvelle stratégie antiterroriste ». Constat d''ouverture : « Depuis trente ans, une loi contre le terrorisme a été adoptée tous les deux ans. »'
- n: 20
  ref: ch. 4, § 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre4/s3/
  title: Refonder une police républicaine
  summary: 'Refonder une police républicaine. 12 mesure(s), dont la mesure-clé : « Refonder les activités de police pour garantir le droit à la sûreté ». Constat d''ouverture : « La République a besoin d’une justice, mais également d’une police qui lui soit loyale, et qui soit attachée aux principes de l’état de droit. »'
- n: 21
  ref: Ouverture de partie
  url: https://melenchon2027.fr/programme2025/livre/l-harmonie-des-etres-humains-entre-eux/
  title: L’harmonie des êtres humains entre eux
  summary: 'Ouverture de la partie 2 : citations ; égalité, services publics, partage des richesses.'
- n: 22
  ref: ch. 5
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/
  title: 'Chapitre 5 : Élever le niveau d’instruction'
  summary: Page d'ouverture du chapitre 5 (titre seul).
- n: 23
  ref: ch. 5, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s1/
  title: Éradiquer l’illettrisme et développer l’alphabétisation
  summary: 'Éradiquer l’illettrisme et développer l’alphabétisation. 4 mesure(s), dont la mesure-clé : « Éradiquer l’illettrisme pour les jeunes sortis du système scolaire et les adultes à l’horizon 2027 ». Constat d''ouverture : « Les difficultés de lecture touchent plus de 4 millions de personnes dans l’Hexagone. »'
- n: 24
  ref: ch. 5, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s2/
  title: Faire le service public de la petite enfance
  summary: 'Faire le service public de la petite enfance. 7 mesure(s), dont la mesure-clé : « Créer un service public de la petite enfance et ouvrir 500 000 places en crèche et modes de garde adaptés sur cinq ans ». Constat d''ouverture : « Tant que la charge totale du travail des femmes, activité domestique comprise, demeurera supérieure à celle des hommes, elles n’auront pas leur juste part de liberté, de loisirs et de repos. »'
- n: 25
  ref: ch. 5, § 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s3/
  title: Reconstruire une école globale pour l’égalité et l’émancipation
  summary: 'Reconstruire une école globale pour l’égalité et l’émancipation. 38 mesure(s), dont la mesure-clé : « Assurer la gratuité réelle de l’éducation publique, y compris les cantines, le transport et les activités périscolaires, fournir gratuitement aux élèves les manuels scolaires, ainsi que des fournitures sans marque, pour assurer une réelle égalité des conditions entre élèves sur tout le territoire et lutter contre l’intrusion marchande à l’école ». Constat d''ouverture : « Une des grandes conquêtes sociales du siècle passé consiste à avoir arraché les enfants aux violences de l’usine pour les accueillir à l’école publique. »'
- n: 26
  ref: ch. 5, § 4
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s4/
  title: Qualifier tout le monde
  summary: 'Qualifier tout le monde. 11 mesure(s), dont la mesure-clé : « Augmenter le nombre de classes et de lycées professionnels et agricoles publics ». Constat d''ouverture : « L’élévation continue du niveau de qualification des travailleurs est essentielle. »'
- n: 27
  ref: ch. 5, § 5
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s5/
  title: Être une grande nation scientifique
  summary: 'Être une grande nation scientifique. 12 mesure(s), dont la mesure-clé : « Financer des plans généraux de thèmes de recherche sur des secteurs d’avenir ». Constat d''ouverture : « Le développement et le rayonnement scientifiques sont un pilier de notre indépendance et de notre épanouissement à l’ère des incertitudes écologiques. »'
- n: 28
  ref: ch. 5, § 6
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s6/
  title: Refonder l’enseignement supérieur
  summary: 'Refonder l’enseignement supérieur. 11 mesure(s), dont la mesure-clé : « Garantir à tous les bacheliers l’accès sans sélection à la formation de leur choix en démantelant le système Parcoursup et restaurer le droit à la poursuite d’études en Master ». Constat d''ouverture : « Précarité des étudiants, doctorants et jeunes diplômés, manque de places, sélection à l’entrée, concurrence entre établissements et entre chercheurs pour des financements insuffisants et aléatoires : c’est dans l’enseignement supérieur que les conséquences de la marchandisation et du démantèlement du service public sont les plus avancées. »'
- n: 29
  ref: ch. 5, § 7
  url: https://melenchon2027.fr/programme2025/livre/chapitre5/s7/
  title: Créer une conscription pour le secours collectif
  summary: 'Créer une conscription pour le secours collectif. 5 mesure(s), dont la mesure-clé : « Instaurer une conscription citoyenne et créer une garde civile nationale ». Constat d''ouverture : « Le Service national universel (SNU) mis en place par Emmanuel Macron, est aussi coûteux qu’inutile. »'
- n: 30
  ref: ch. 6
  url: https://melenchon2027.fr/programme2025/livre/chapitre6/
  title: 'Chapitre 6 : Partage des richesses'
  summary: Page d'ouverture du chapitre 6 (titre seul).
- n: 31
  ref: ch. 6, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre6/s1/
  title: Mettre au pas la finance
  summary: 'Mettre au pas la finance. 5 mesure(s), dont la mesure-clé : « Instaurer une taxe réelle sur les transactions financières ». Constat d''ouverture : « La finance a mis à terre l’économie réelle en 2008. »'
- n: 32
  ref: ch. 6, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre6/s2/
  title: Pour des banques au service de l’intérêt général
  summary: 'Pour des banques au service de l’intérêt général. 6 mesure(s), dont la mesure-clé : « Créer un pôle public bancaire ». Constat d''ouverture : « Le crédit est essentiel à l’économie : il est à la base de l’activité future. »'
- n: 33
  ref: ch. 6, § 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre6/s3/
  title: Définanciariser l’économie réelle
  summary: 'Définanciariser l’économie réelle. 5 mesure(s), dont la mesure-clé : « Établir de nouveaux indicateurs de progrès humain pour mettre l’économie au service des objectifs et des critères de bien-vivre (santé, éducation, etc.) ». Constat d''ouverture : « Les actionnaires exigent des taux de rendement intenables, obtenus au détriment des droits sociaux et des conditions, notamment environnementales, de production. »'
- n: 34
  ref: ch. 6, § 4
  url: https://melenchon2027.fr/programme2025/livre/chapitre6/s4/
  title: 'Refuser le chantage : annuler la dette publique'
  summary: 'Refuser le chantage : annuler la dette publique. 7 mesure(s), dont la mesure-clé : « Exiger de l’Union européenne que la Banque centrale européenne (BCE) transforme la part de dette des États qu’elle possède en dettes perpétuelles à taux nul ». Constat d''ouverture : « La dette publique est instrumentalisée pour justifier l’austérité et les privatisations. »'
- n: 35
  ref: ch. 6, § 5
  url: https://melenchon2027.fr/programme2025/livre/chapitre6/s5/
  title: Faire la révolution fiscale
  summary: 'Faire la révolution fiscale. 20 mesure(s), dont la mesure-clé : « Rendre l’impôt sur le revenu plus progressif avec un barème à 14 tranches contre 5 aujourd’hui ». Constat d''ouverture : « Le président des riches n’a fait qu’aggraver les injustices de notre système fiscal et créer de nouveaux privilèges fiscaux pour les riches. »'
- n: 36
  ref: ch. 7
  url: https://melenchon2027.fr/programme2025/livre/chapitre7/
  title: 'Chapitre 7 : La force de l’entraide'
  summary: Page d'ouverture du chapitre 7 (titre seul). Les 9 sections du chapitre manquent dans toutes les archives consultées (voir lfi-synthese-contributions).
- n: 37
  ref: ch. 8
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/
  title: 'Chapitre 8 : Travailler tous, travailler moins, travailler mieux'
  summary: Page d'ouverture du chapitre 8 (titre seul).
- n: 38
  ref: ch. 8, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s1/
  title: Établir la garantie d’emploi
  summary: 'Établir la garantie d’emploi. 1 mesure(s), dont la mesure-clé : « Créer une garantie d’emploi : tout chômeur de longue durée pourra se voir proposer d’être embauché au moins au SMIC revalorisé dans un secteur d’urgence ». Constat d''ouverture : « Le chômage est un fléau pour les individus, pour les familles et pour la société tout entière. »'
- n: 39
  ref: ch. 8, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s2/
  title: Réduire le temps de travail et faire naître une société du temps choisi
  summary: 'Réduire le temps de travail et faire naître une société du temps choisi. 6 mesure(s), dont la mesure-clé : « Rétablir immédiatement la durée légale hebdomadaire à 35 heures (en majorant les heures supplémentaires, cotisations incluses, à 25 % pour les 4 premières et 50 % au-delà), passer aux 32 heures dans les métiers pénibles ou de nuit, et favoriser leur généralisation par la négociation collective ». Constat d''ouverture : « Le temps de travail des salariés français n’a pas diminué depuis 2002. »'
- n: 40
  ref: ch. 8, § 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s3/
  title: Un emploi stable pour chacun
  summary: 'Un emploi stable pour chacun. 5 mesure(s), dont la mesure-clé : « Instaurer un quota maximal de contrats précaires dans les entreprises : 10 % pour les petites et moyennes entreprises (PME), 5 % pour les grandes entreprises ». Constat d''ouverture : « Près de 4 millions de personnes travaillent en emploi précaire. »'
- n: 41
  ref: ch. 8, § 4
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s4/
  title: Augmenter les salaires et réduire les inégalités salariales dans l’entreprise
  summary: 'Augmenter les salaires et réduire les inégalités salariales dans l’entreprise. 11 mesure(s), dont la mesure-clé : « Porter immédiatement le SMIC mensuel à 1600 euros net et indexer les salaires sur l’inflation dans le privé et dans la fonction publique ». Constat d''ouverture : « Un salarié au SMIC gagne à peine plus que le seuil de pauvreté. »'
- n: 42
  ref: ch. 8, § 5
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s5/
  title: Rétablir une assurance-chômage protectrice
  summary: 'Rétablir une assurance-chômage protectrice. 9 mesure(s), dont la mesure-clé : « Revenir sur les réformes Macron en abrogeant l’éligibilité et les méthodes de calcul du montant et de la durée de l’allocation pour indemniser les chômeurs en fonction de leurs derniers salaires grâce à une assurance calculée à partir du premier jour de travail ». Constat d''ouverture : « Le gouvernement Macron prépare de longue main le démantèlement de l’assurance-chômage. »'
- n: 43
  ref: ch. 8, § 6
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s6/
  title: Une sécurité sociale professionnelle
  summary: 'Une sécurité sociale professionnelle. 4 mesure(s), dont la mesure-clé : « Assurer la continuité des droits personnels (à la formation, aux congés, à l’ancienneté…), hors du contrat de travail, et les transférer d’un contrat à l’autre ». Constat d''ouverture : « Le monde du travail est si instable et précaire qu’il est difficile de progresser dans son métier. »'
- n: 44
  ref: ch. 8, § 7
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s7/
  title: En finir avec la souffrance au travail
  summary: 'En finir avec la souffrance au travail. 12 mesure(s), dont la mesure-clé : « Porter un objectif de zéro mort au travail ». Constat d''ouverture : « Qui n’a pas entendu parler du burn-out ou de surmenage dû au travail ? »'
- n: 45
  ref: ch. 8, § 8
  url: https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
  title: Garantir une retraite digne
  summary: 'Garantir une retraite digne. 7 mesure(s), dont la mesure-clé : « Abroger la réforme d’Emmanuel Macron passant l’âge de départ à la retraite à 64 ans et restaurer le droit à la retraite à 60 ans à taux plein pour 40 annuités de cotisations ». Constat d''ouverture : « De janvier à juin 2023, notre pays a connu une des mobilisations les plus massives de son histoire contre la réforme des retraites d’Emmanuel Macron et d’Elisabeth Borne. »'
- n: 46
  ref: ch. 9
  url: https://melenchon2027.fr/programme2025/livre/chapitre9/
  title: 'Chapitre 9 : Produire nous même pour répondre aux besoins'
  summary: Page d'ouverture du chapitre 9 (titre seul).
- n: 47
  ref: ch. 9, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre9/s1/
  title: Créer un état d’urgence sociale
  summary: 'Créer un état d’urgence sociale. 5 mesure(s), dont la mesure-clé : « Bloquer les prix des produits de première nécessité (alimentation, énergie, carburant) et interdire la « réduflation » ». Constat d''ouverture : « Ces dernières années, les états d’urgence se multiplient : sécuritaire, sanitaire. »'
- n: 48
  ref: ch. 9, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre9/s2/
  title: Réindustrialiser et relocaliser pour assurer notre indépendance
  summary: 'Réindustrialiser et relocaliser pour assurer notre indépendance. 15 mesure(s), dont la mesure-clé : « Relocaliser les productions essentielles à la vie de notre pays ». Constat d''ouverture : « L’année 2024 marque la fin de la réindustrialisation en trompe-l’œil. »'
- n: 49
  ref: ch. 9, § 3
  url: https://melenchon2027.fr/programme2025/livre/chapitre9/s3/
  title: Lancer des grands chantiers écologiques, créateurs d’emplois
  summary: 'Lancer des grands chantiers écologiques, créateurs d’emplois. 9 mesure(s), dont la mesure-clé : « Engager un plan global de rénovation de nos infrastructures pour les adapter au changement climatique ». Constat d''ouverture : « Le changement climatique est commencé. »'
- n: 50
  ref: ch. 10
  url: https://melenchon2027.fr/programme2025/livre/chapitre10/
  title: 'Chapitre 10 : Faire place à la nouvelle France'
  summary: Page d'ouverture du chapitre 10 (titre seul).
- n: 51
  ref: ch. 10, § 1
  url: https://melenchon2027.fr/programme2025/livre/chapitre10/s1/
  title: Réaliser l’égalité entre les femmes et les hommes
  summary: 'Réaliser l’égalité entre les femmes et les hommes. 15 mesure(s), dont la mesure-clé : « Adopter une loi de lutte contre le sexisme et les violences faites aux femmes, et allouer les 2,6 milliards de budget demandé par les associations, notamment en matière de formation et de places d’hébergement, et garantir une budgétisation sensible au genre et transparente ». Constat d''ouverture : « La plus ancienne et cruelle inégalité remonte à l’aube de l’humanité, lorsque notre espèce a développé des croyances concernant le rôle des femmes et des hommes. »'
- n: 52
  ref: ch. 10, § 2
  url: https://melenchon2027.fr/programme2025/livre/chapitre10/s2/
