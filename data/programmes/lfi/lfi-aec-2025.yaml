- id: LFI-04.01-01
  page: 18
  kind: mesure-cle
  themes:
  - libertes-laicite
  text: Constitutionnaliser la non-marchandisation du corps humain et le droit fondamental de disposer de soi en toutes circonstances
- id: LFI-04.01-02
  page: 18
  kind: mesure
  themes:
  - libertes-laicite
  - sante
