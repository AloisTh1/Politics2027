- page: 18
  kind: sondage
  text: 89 % des Français sont favorables à la légalisation de l’euthanasie (acte déclenché par le corps médical) et 92 % à la légalisation du suicide assisté (acte déclenché par le patient lui-même) (Ifop, 2024)
- page: 20
  kind: sondage
