  text: Abandonner le processus de réforme constitutionnelle visant au dégel immédiat du corps électoral. C’est un geste fort d’apaisement qui permettra de retrouver le chemin du dialogue et de la recherche du consensus. À travers la mission de dialogue, renouer avec la promesse du « destin commun », dans l’esprit des accords de Matignon et de Nouméa et d’impartialité de l’État, en soutenant la recherche d’un projet d’accord global qui engage un véritable processus d’émancipation et de décolonisation.
