doc: lfi-nfp-2024
pages:
- n: 1
  summary: 'Couverture : « Contrat de législature ».'
- n: 2
  summary: 'Préambule : rupture avec la politique d''E. Macron, contre « le projet raciste et de casse sociale de l''extrême droite » ; vote les 30 juin et 7 juillet 2024.'
- n: 3
  summary: 'Partie 1, « 15 premiers jours » : 20 actes de rupture.'
- n: 4
  summary: 'Urgence sociale : blocage des prix, abrogation des décrets de la réforme des retraites, SMIC à 1 600 € net, point d''indice +10 %, APL +10 % ; logement ; climat.'
- n: 5
  summary: Services publics (hôpital, école), apaisement (police de proximité, interdiction des LBD), Nouvelle-Calédonie, Europe.
- n: 6
  summary: 'Paix : diplomatie des biens communs, Afrique, APD à 0,7 % ; Ukraine : livraison d''armes, saisie des avoirs d''oligarques.'
- n: 7
  summary: 'Gaza : cessez-le-feu, otages, CPI, reconnaissance de la Palestine, embargo sur les armes, sanctions.'
- n: 8
  summary: 'Partie 2, « 100 premiers jours » : cinq paquets législatifs.'
- n: 9
  summary: Pouvoir d'achat (indexation des salaires, AAH au SMIC, énergie), santé (régulation de l'installation, pôle public du médicament, PFAS).
- n: 10
  summary: Éducation (mixité sociale, fin de Parcoursup), garantie d'autonomie, recherche ; planification écologique.
- n: 11
  summary: Énergies renouvelables, énergies marines, ASN/IRSN, barrages, Fret SNCF, adaptation au changement climatique.
- n: 12
  summary: Lutte contre le racisme, l'antisémitisme et l'islamophobie ; Commissariat à l'égalité.
- n: 13
  summary: 'Loi de finances rectificative : IR à 14 tranches, CSG progressive, ISF climatique, fin de la flat tax, héritage maximum, impôt Zucman sur les multinationales.'
- n: 14
  summary: 'Partie 3, « Les mois suivants » : les transformations.'
- n: 15
  summary: Services publics (30 minutes d'un accueil physique), 500 000 places de crèche, protection de l'enfance, handicap, grand âge.
- n: 16
  summary: Accessibilité ; logement (200 000 logements publics par an, encadrement des loyers, garantie universelle des loyers) ; retraites (objectif 60 ans).
- n: 17
  summary: 6e République (proportionnelle, RIC, constituante), fin de vie ; sûreté, police de proximité, suppression de l'IGPN, justice.
- n: 18
  summary: Récépissés de contrôle ; réindustrialisation, aides conditionnées, pôle public bancaire, un tiers des sièges des CA aux salariés.
- n: 19
  summary: Aides aux PME-TPE, 35 h effectives et 32 h dans les métiers pénibles, « zéro mort au travail », transports (TVA à 5,5 %).
- n: 20
  summary: Biodiversité, eau en régie, agriculture (CETA, Mercosur, foncier, bio).
- n: 21
  summary: Glyphosate et néonicotinoïdes, jeunesse (fin du SNU), droits des femmes et des personnes LGBTQI.
- n: 22
  summary: Bien-être animal, culture et médias (1 % du PIB, anti-concentration), laïcité (pas de financement public de nouveaux édifices religieux).
- n: 23
  summary: Sport, numérique, Outre-mer (chlordécone, eau, plan quinquennal).
- n: 24
  summary: 'Outre-mer (Mayotte) ; accueil des exilés : abrogation des lois asile-immigration, régularisations, AME.'
- n: 25
  summary: 'Droit du sol, libertés publiques (reconnaissance faciale interdite, lanceurs d''alerte) ; Europe : refus du pacte de stabilité, fin des traités de libre-échange.'
- n: 26
  summary: Vote à la majorité qualifiée sur la fiscalité ; refus du pacte budgétaire et du droit de la concurrence quand il remet en cause les services publics.
measures:
- id: NFP-01
  page: 4
  themes:
  - classes-populaires
  - energie
  text: Bloquer les prix des biens de première nécessité dans l’alimentation, l’énergie et les carburants par décret, et renforcer le bouclier qualité-prix pour les outre-mer
- id: NFP-02
  page: 4
  themes:
  - retraites
  text: Abroger immédiatement les décrets d’application de la réforme d’Emmanuel Macron passant l’âge de départ à la retraite à 64 ans, ainsi que les réformes de l’assurance-chômage
- id: NFP-03
  page: 4
  themes:
  - classes-populaires
  - retraites
  text: Augmenter le minimum contributif (pension de retraite pour une carrière complète) au niveau du SMIC et le minimum vieillesse au niveau du seuil de pauvreté
- id: NFP-04
  page: 4
  themes:
  - classes-populaires
  text: Augmenter les salaires par le passage du SMIC à 1600€ net, par la hausse de 10% du point d’indice des fonctionnaires (intégralement compensée pour les collectivités territoriales), augmenter les indemnités des stagiaires, le salaire des apprentis et des alternants
- id: NFP-05
  page: 4
  themes: []
  text: Engager les négociations commerciales en garantissant un prix plancher et rémunérateur aux agriculteurs et en taxant les superprofits des agro-industriels et de la grande distribution
