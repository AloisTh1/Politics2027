  page: 5
  themes: []
  text: Redonner à l’école publique son objectif d’émancipation en abrogeant le « choc des savoirs » de Macron, et préserver la liberté pédagogique
- id: NFP-14
  page: 5
  themes: []
  text: 'Faire les premiers pas pour la gratuité intégrale à l’école : cantine scolaire, fournitures, transports, activités périscolaires'
- id: NFP-15
  page: 5
  themes: []
  text: Augmenter le montant du Pass’Sport à 150 euros et étendre son utilisation au sport scolaire en vue de la rentrée
- id: NFP-16
