doc: rn-contre-budget-2026
# Montants en milliards d'euros pour 2026, tels qu'annoncés par le groupe RN (annexe p. 7).
# effet : "economie" (baisse de dépense), "recette" (hausse de recette),
#         "baisse-impot" (baisse de recette), "depense" (hausse de dépense)
pages:
  - n: 1
    summary: "Couverture : « Conférence de presse — 23 octobre 2025 »."
  - n: 2
    summary: "« Héritage » : déficit public 2026 à -4,7 % du PIB, dette à 117,9 %, dépenses publiques +28,5 Md€ entre 2025 et 2026, charge de la dette 74 Md€ (graphique « Présidence Macron »)."
  - n: 3
    summary: "Synthèse des économies (contribution à l'UE, agences, immigration, associations, collectivités) et des recettes nouvelles (impôt sur la fortune financière, taxe sur les rachats d'actions, certificats d'économie d'énergie, fraude)."
  - n: 4
    summary: "Synthèse des baisses d'impôts (TVA sur les énergies 10,96 Md€, TVA sur 100 produits, part fiscale dès le 2e enfant, impôts de production 16,2 Md€) et des dépenses nouvelles (réforme des retraites du RN 1,5 Md€, dégel des prestations)."
  - n: 5
    summary: "Bilan : -57 Md€ de dépenses, +7 Md€ de dépenses nouvelles, +31 Md€ de recettes, -45 Md€ d'impôts, soit 36 Md€ d'« économies dégagées » ; comparaison avec le budget Lecornu (déficit 143 contre 107 Md€, dette 3 609 contre 3 573 Md€)."
  - n: 6
    summary: "Intercalaire « Annexes »."
  - n: 7
    summary: "Tableau détaillé, ligne par ligne, des 88,3 Md€ d'économies et recettes et des 52,7 Md€ de baisses d'impôts et dépenses nouvelles (solde : 35,6 Md€)."
  - n: 8
    summary: "Quatrième de couverture (sans texte)."

totals:
  economies_et_recettes: 88.274
  baisses_et_depenses: 52.674
  solde: 35.6
  bilan_p5: {depenses_baisse: 57, depenses_nouvelles: 7, recettes_nouvelles: 31, baisses_impots: 45, economies_nettes: 36}
  comparaison_p5: {deficit_lecornu: 143, deficit_rn: 107, dette_lecornu: 3609, dette_rn: 3573, interets_lecornu: 74, interets_rn: 71, prelevements_lecornu: 19, prelevements_rn: -1}

