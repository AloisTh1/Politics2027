doc: rn-contre-budget-2025
# Amendements du groupe RN au projet de loi de finances pour 2025 (présentation du 16 octobre 2024).
# Montants en Md€ : signe + = amélioration du solde public, signe - = coût.
pages:
  - n: 1
    summary: "Couverture : « Présentation à la presse — 16 octobre 2024 » : « Rendre du pouvoir d'achat aux Français, défendre les entrepreneurs, lutter contre les rentes et la spéculation, dégraisser l'État »."
  - n: 2
    summary: "Intercalaire « Nos propositions »."
  - n: 3
    summary: "Bilan budgétaire des amendements RN au PLF 2025, ligne par ligne : ménages (-22,8 Md€), entrepreneurs (-5,35), rentes et spéculation (+21,79), collectivités (+1,32), État (+4,06), immigration (+4,1), divers (+10,64) ; solde +13,7 Md€."
  - n: 4
    summary: "Page sans texte."
  - n: 5
    summary: "Annexe 1 : baisse de 20 % des taxes affectées à une trentaine d'agences et opérateurs (AFITF, agences de l'eau, ANAH, France Compétences, etc.), total 3,44 Md€."
  - n: 6
    summary: "Annexe 2 : baisse de prélèvements sur recettes destinés aux régions (0,2 Md€)."
  - n: 7
    summary: "Annexe 3 : ventilation par mission des économies de la partie II (associations, presse, aide au développement, ADEME, culture, hébergement d'urgence, prime d'activité, AME)."
  - n: 8
    summary: "Quatrième de couverture (sans texte)."

totals:
  solde: 13.7
  blocs: {menages: -22.8, entrepreneurs: -5.35, rentes_speculation_fraudes: 21.79, collectivites: 1.32, appareil_etat: 4.06, immigration: 4.1, divers: 10.64}

